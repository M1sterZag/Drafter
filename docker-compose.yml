services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dota-draft-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - dota-network

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: dota-draft-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dota-network

  # Входная точка: HTTPS для домена, сертификат выпускается и продлевается автоматически
  caddy:
    image: caddy:2.8.4-alpine
    container_name: dota-draft-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - dota-network

networks:
  dota-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
