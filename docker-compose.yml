version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dota-draft-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - dota-network

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: dota-draft-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dota-network

networks:
  dota-network:
    driver: bridge